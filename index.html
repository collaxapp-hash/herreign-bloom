:root {
  color-scheme: light;
  background: #f3c9c6;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; min-height: 100%; }
body {
  min-height: 100svh;
  min-height: 100dvh;
  display: grid;
  place-items: center;
  overflow: hidden;
  touch-action: manipulation;
  background: linear-gradient(180deg, #f3cac6 0%, #f3cac6 12%, #fffafa 50%, #f1bfbb 88%, #f1bfbb 100%);
}

.flower-stage {
  container-type: inline-size;
  position: relative;
  width: min(100vw, calc(100svh * 9 / 16));
  width: min(100vw, calc(100dvh * 9 / 16));
  aspect-ratio: 9 / 16;
  overflow: hidden;
  isolation: isolate;
  user-select: none;
  -webkit-user-select: none;
  background: #fffafa;
}

/* A cached, static background covers the source video's moving backdrop.
   Its transparent opening protects the flower's full 124-frame motion envelope. */
.flower-stage::before {
  content: "";
  position: absolute;
  z-index: 2;

    ready: '花朵准备绽放，轻触页面即可播放。',

    setCopy(false);
    setState('holding');
    if (video.error) {
      video.load();
    } else if (video.readyState > 0 && video.currentTime !== 0) {
      video.currentTime = 0;
    }
    queueOpening();
  }

  video.muted = true;
  video.defaultMuted = true;
  video.addEventListener('loadeddata', queueOpening);
  video.addEventListener('canplay', queueOpening);
  video.addEventListener('playing', () => {
    if (video.paused) return;
    setState('playing');
    syncCopy();
    watchFrame();
  });
  video.addEventListener('timeupdate', () => syncCopy());
  video.addEventListener('seeked', () => {
    syncCopy();
    queueOpening();
  });
  video.addEventListener('pause', stopFrameWatch);
  video.addEventListener('ended', () => {
    if (!video.ended || state === 'holding') return;
    stopFrameWatch();
    setCopy(true);
    setState('ended');
    // Keep this exact decoded frame. Never swap video for an RGB still image.
  });
  video.addEventListener('error', () => {
    cancelOpeningWait();
    stopFrameWatch();
    setState('error');
  });
  // A trusted click works for touch and mouse. Touch pointerdown can precede
  // user activation; also retry an unresolved play promise or a media error.
  function retryBlockedPlayback() {
    if (['ready', 'starting', 'error'].includes(state) || (state === 'holding' && openingDelayElapsed)) {
      play(playAttempt, true);
    }
  }
  document.addEventListener('click', retryBlockedPlayback, { passive: true });
  document.addEventListener('keydown', retryBlockedPlayback);
  document.addEventListener('dblclick', beginOpening);

  if (video.poster) {
    const poster = new Image();
    const onPosterSettled = () => {
      posterSettled = true;
      queueOpening();
    };
    poster.addEventListener('load', onPosterSettled, { once: true });
    poster.addEventListener('error', onPosterSettled, { once: true });
    poster.src = video.poster;
  }

  beginOpening();
})();

    </script>
  </body>
